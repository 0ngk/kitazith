name: Gleam bootstrap

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      otp-version:
        required: false
        type: string
        default: "28.4.2"
      gleam-version:
        required: false
        type: string
        default: "1.15.2"
      rebar3-version:
        required: false
        type: string
        default: "3.27.0"
      run-validate:
        required: false
        type: boolean
        default: false
      run-tag-version-check:
        required: false
        type: boolean
        default: false
      run-publish:
        required: false
        type: boolean
        default: false
      run-github-release:
        required: false
        type: boolean
        default: false
    secrets:
      hexpm_api_key:
        required: false

jobs:
  validate:
    if: ${{ inputs.run-validate || inputs.run-tag-version-check }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: ${{ inputs.checkout-ref == '' }}
        uses: &actions_checkout actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Checkout
        if: ${{ inputs.checkout-ref != '' }}
        uses: *actions_checkout
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Erlang and Gleam
        uses: &setup_beam erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          otp-version: ${{ inputs.otp-version }}
          gleam-version: ${{ inputs.gleam-version }}
          rebar3-version: ${{ inputs.rebar3-version }}
          version-type: strict

      - name: Validate root and example packages
        if: ${{ inputs.run-validate }}
        run: bash ./scripts/validate_packages.sh

      - name: Validate release tag matches gleam.toml
        if: ${{ inputs.run-tag-version-check }}
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' gleam.toml | head -n 1)"

          if [[ -z "$package_version" ]]; then
            echo "Failed to read version from gleam.toml" >&2
            exit 1
          fi

          if [[ "$package_version" != "$expected_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gleam.toml version ${package_version}" >&2
            exit 1
          fi

  publish:
    if: ${{ inputs.run-publish || inputs.run-github-release }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        if: ${{ inputs.checkout-ref == '' }}
        uses: *actions_checkout

      - name: Checkout
        if: ${{ inputs.checkout-ref != '' }}
        uses: *actions_checkout
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Erlang and Gleam
        uses: *setup_beam
        with:
          otp-version: ${{ inputs.otp-version }}
          gleam-version: ${{ inputs.gleam-version }}
          rebar3-version: ${{ inputs.rebar3-version }}
          version-type: strict

      - name: Publish package to Hex.pm
        if: ${{ inputs.run-publish }}
        env:
          HEXPM_API_KEY: ${{ secrets.hexpm_api_key }}
        run: printf 'I am not using semantic versioning\n' | gleam publish --yes

      - name: Create a GitHub release
        if: ${{ inputs.run-github-release }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          generate_release_notes: true
