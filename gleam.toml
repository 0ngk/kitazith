name = "kitazith"
version = "0.1.3"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
description = "A Gleam library for building Discord webhook payloads safely."
licences = ["MIT"]
repository = { type = "github", user = "0ngk", repo = "kitazith" }
links = [{ title = "Hex", href = "https://hex.pm/packages/kitazith" }]
#
# For a full reference of all the available options, you can have a look at
